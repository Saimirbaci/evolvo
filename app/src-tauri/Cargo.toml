[package]
name = "evolvo_desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Evolvo — white canvas feedback + lineage desktop app"

[lib]
name = "evolvo_desktop"
path = "src/lib.rs"

[[bin]]
name = "evolvo_desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Host-side only (never in the WASM bundle): validators capture build-tool
# output into a temp file to surface error tails in stage reports.
tempfile = "3.14"

[dev-dependencies]
